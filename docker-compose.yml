# Quadra - Docker Compose per sviluppo locale
# Uso: docker-compose up -d
#
# Questo file permette di sviluppare con lo stesso stack di produzione.
# Per produzione su Coolify, usa docker-compose.prod.yml

services:
  # ============================================
  # DATABASE - PostgreSQL
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: quadra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quadra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quadra_dev}
      POSTGRES_DB: ${POSTGRES_DB:-quadra}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quadra}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # CACHE & QUEUE - Redis
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: quadra-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # STORAGE - MinIO (S3-compatible)
  # ============================================
  minio:
    image: minio/minio:latest
    container_name: quadra-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # Console
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ============================================
  # BACKEND - FastAPI
  # ============================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quadra-api
    restart: unless-stopped
    environment:
      - ENVIRONMENT=development
      - DEBUG=true
      - DATABASE_URL=postgresql://${POSTGRES_USER:-quadra}:${POSTGRES_PASSWORD:-quadra_dev}@postgres:5432/${POSTGRES_DB:-quadra}
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-quadra-documents}
      # Microsoft Entra ID (opzionale in dev)
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID:-}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET:-}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID:-common}
      - AZURE_REDIRECT_URI=${AZURE_REDIRECT_URI:-http://localhost:8000/auth/callback}
      # JWT
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-change-in-production}
    ports:
      - "8000:8000"
    volumes:
      # Hot reload per sviluppo
      - ./backend:/app/backend:ro
      - ./fixtures:/app/fixtures:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

  # ============================================
  # WORKER - Celery (per task asincroni)
  # ============================================
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: quadra-worker
    restart: unless-stopped
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-quadra}:${POSTGRES_PASSWORD:-quadra_dev}@postgres:5432/${POSTGRES_DB:-quadra}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/2
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - ./backend:/app/backend:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - full  # Attiva con: docker-compose --profile full up

  # ============================================
  # FRONTEND - React (dev server)
  # ============================================
  ui:
    image: node:20-alpine
    container_name: quadra-ui
    working_dir: /app
    environment:
      - VITE_API_URL=http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./ui:/app
      - ui_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    profiles:
      - full  # Attiva con: docker-compose --profile full up

volumes:
  postgres_data:
  redis_data:
  minio_data:
  ui_node_modules:

# ============================================
# NETWORKS
# ============================================
networks:
  default:
    name: quadra-network
