missing_docs_report:
  source: richiesta_doc
  quarter: current
  include_status: ["wip", ""]
  exclude_status: ["✓", "✗", "N/A"]
  output: "mancanti.md plus compiled xlsx copy"

automation_gates:
  closed_2026_09_08:
    - master_for_all_clients
    - each_quarter_starts_from_master_plus_new_docs
    - absent_doc_is_wip
    - x_means_skipped_control
    - app_writes_indice_status
    - ferrero_oddities_were_human_error
  still_open: [f24_ytd_vs_quarter, fondi_rows, collegio_row_on_F, materiality_threshold, datasnipper_ignore]
