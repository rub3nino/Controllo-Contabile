        D: account_name
        E: amount_current
        F: amount_prior
        G: amount_chg
        H: pct_chg
    current_header_is_period_end: true
    formulas_not_preloaded: true
  H:
    title: "SEZIONE H - COLLOQUI CON LA DIREZIONE"
    auto_fill: none
  I:
    title: "SEZIONE I - OPERAZIONI PARTICOLARMENTE SIGNIFICATIVE"
