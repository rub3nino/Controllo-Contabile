# Esempio di ClientConfig (backend/domain/models.py) popolato con i dati
# reali del caso Ferrero, presi da regole/schema.yaml e regole/TEMPLATE_RULES.md.
# Serve a validare che i modelli della Fase 0 riescano a rappresentare un
# cliente vero, non solo a compilare come tipi Python astratti.
#
# Non e' la fonte di verita' normativa (quella resta regole/TEMPLATE_RULES.md
# e regole/schema.yaml): e' la stessa sostanza, tradotta nel formato che il
# livello 4 del piano (client config) userebbe in Fase 2+.

client_id: ferrero
display_name: "Gruppo Ferrero S.p.A."

# Le 25 voci standard del catalogo (A.1...G.2, vedi backend/catalog.py e
# regole/schema.yaml:richiesta_doc.items) si applicano tutte a Ferrero: non
# risulta, nelle fonti lette, un motivo per escluderne qualcuna (es.
# l'Intrastat E.5 e' plausibile per un gruppo che opera nell'UE). Nessuna
# esclusione e' stata inventata qui: se in futuro emerge che una voce non
# si applica, va tolta da questa lista, non lasciata "wip" per sempre.
applicable_items:
  - A.1
  - A.2
  - A.3
  - A.4
  - B.1
  - B.2
  - B.3
  - B.4
  - C.1
  - C.2
  - C.3
  - C.4
  - D.1
  - D.2
  - D.3
  - E.1
  - E.2
  - E.3
  - E.4
  - E.5
  - F.1
  - F.2
  - F.3
  - G.1
  - G.2

