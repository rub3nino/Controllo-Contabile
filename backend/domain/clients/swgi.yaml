# Come per Ferrero, il libro dei verbali del Collegio sindacale resta una
# questione aperta distinta dai singoli verbali richiesti in C.3. Il
# verbale SWGI del 29/04/2026 documenta la nomina del Collegio, ma non
# risolve se il libro debba diventare una riga stabile del master: questa
# voce mantiene visibile il caso senza anticipare la decisione.
extra_items:
  - id: CS.1
    label: "Libro verbali del Collegio sindacale"
    section: F
    note: "Questione aperta sul master: il verbale SWGI del 29/04/2026 documenta la nomina del Collegio ma non prova la continuita' del relativo libro; voce dimostrativa, non decisione normativa."
    hints:
      - "collegio sindacale"
      - "verbale collegio"
      - sindaci

